version: 2

models:
  - name: manual_report_staged
    description: >
      Staged preauth manual upload daily report (multi-tenant). Fully
      replaced on every run - see the model's own docstring for why.
      NOTE: preauth_claim_id is deliberately NOT tested for uniqueness -
      a single claim can legitimately produce more than one row per day
      (a SUBMISSION event and a QUERY event, or multiple resubmissions on
      the SUBMISSION branch). Confirmed with real production data,
      2026-08-11 session - see PROJECT_CONTEXT Section 16, Part C. Adding
      a uniqueness test here would fail on exactly the claims we proved
      are handled correctly.
    columns:
      - name: preauth_claim_id
        description: Not unique by design - see model description above.
        tests:
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: start_date
        tests:
          - not_null
      - name: end_date
        tests:
          - not_null
      - name: functionality
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PREAUTH']
      - name: automation_type
        description: >
          Which branch produced this row - the model only ever emits
          these two literal values (see manual_report_staged.sql).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SUBMISSION', 'QUERY']
